<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Contoh Javascript Dasar</title>
</head>
<body>
 <p id="teksPesan">ini adalah teks awal</p>
 <button id="tombolWarna">ubah warna latar</button>
 <h1>Selamat Datang di Praktikum Javascript!</h1>
 <button id="tombolSapa">Klik Saya!</button>
 <script>
  document.getElementById('teksPesan').textContent = 'Teks paragraf sudah diubah oleh Javascript!';
 // Mendapatkan elemen tombol berdasarkan ID
 const tombol = document.getElementById('tombolSapa');
 // Menambahkan event listener untuk aksi 'click'
 tombol.addEventListener('click', function() {
 alert('Halo, Selamat Datang di Dunia Javascript!');
});
 const tombolWarna = document.getElementById('tombolWarna');
 tombolWarna.addEventListener('click', function() {
 document.body.style.backgroundColor = 'lightblue';
 });
</script>
</body>
</html>
